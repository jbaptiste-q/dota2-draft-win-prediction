name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIQUIPEDIA_API_KEY: ""
      NO_NETWORK_TESTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install offline-test dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile active Python sources
        run: python -m compileall -q src scripts tests

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Run offline test suite
        run: python -m pytest -q
